version: '3.9'

services:
  backend:
    build: ./backend
    container_name: heist_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
      - heist_data:/app/data
      - heist_media:/app/media
    expose:
      - "8000"
    networks:
      - heist_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: heist_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - heist_net

  nginx:
    image: nginx:alpine
    container_name: heist_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - heist_media:/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - heist_net

volumes:
  heist_data:
  heist_media:


networks:
  heist_net:
    driver: bridge
